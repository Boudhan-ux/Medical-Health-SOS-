name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2

      - name: Java 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Abhängigkeiten installieren
        run: bun install

      - name: Web-App bauen
        run: bun run build
        env:
          # Optional: unter Settings > Secrets and variables > Actions anlegen
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Capacitor & Plugins installieren (falls nötig)
        run: |
          if [ ! -d "node_modules/@capacitor/core" ]; then
            bun add @capacitor/core@latest
          fi
          CAP_VERSION=$(node -p "require('./node_modules/@capacitor/core/package.json').version")
          CAP_MAJOR=$(node -p "require('./node_modules/@capacitor/core/package.json').version.split('.')[0]")
          echo "Capacitor Core Version: $CAP_VERSION (Major: $CAP_MAJOR)"
          if [ ! -d "node_modules/@capacitor/android" ]; then
            bun add @capacitor/android@$CAP_VERSION
          fi
          if [ ! -d "node_modules/@capacitor/cli" ]; then
            bun add -d @capacitor/cli@$CAP_VERSION
          fi
          bun add @capacitor/local-notifications@^$CAP_MAJOR.0.0 @capacitor/filesystem@^$CAP_MAJOR.0.0 @capacitor/share@^$CAP_MAJOR.0.0

      - name: Android-Projekt erzeugen (falls nötig)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Android-Berechtigungen (Benachrichtigungen & Dateidownload) in AndroidManifest.xml eintragen
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            node -e '
              const fs = require("fs");
              const file = "android/app/src/main/AndroidManifest.xml";
              let xml = fs.readFileSync(file, "utf8");
              const perms = [
                "android.permission.POST_NOTIFICATIONS",
                "android.permission.SCHEDULE_EXACT_ALARM",
                "android.permission.USE_EXACT_ALARM",
                "android.permission.RECEIVE_BOOT_COMPLETED",
                "android.permission.VIBRATE",
                "android.permission.WAKE_LOCK",
                "android.permission.READ_EXTERNAL_STORAGE",
                "android.permission.WRITE_EXTERNAL_STORAGE"
              ];
              const tags = perms
                .filter(p => !xml.includes(p))
                .map(p => `    <uses-permission android:name="${p}" />`)
                .join("\n");
              if (tags) {
                xml = xml.replace("</manifest>", tags + "\n</manifest>");
                fs.writeFileSync(file, xml, "utf8");
                console.log("Injected Android permissions:\n" + tags);
              }
            '
          fi

      - name: App-Icon für Android generieren
        run: |
          if [ -f "assets/icon.png" ]; then
            npx --yes @capacitor/assets generate --android --iconBackgroundColor '#d1fae5' --iconBackgroundColorDark '#065f46'
          fi

      - name: Web-Build mit Android synchronisieren
        run: npx cap sync android

      - name: Debug-APK bauen
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: medical-compass-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
